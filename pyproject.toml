[project]
name = "codenamesai"
version = "0.1.0"
description = "A non-LLM Codenames spymaster that chooses clues against a listener model distilled from LLM guessers."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "lightgbm",
    "gensim",
    "nltk",
    "matplotlib",
    "wordfreq",
    "anthropic",
    "openai",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
# A local teacher (codenames/local_lm.py). Qwen3-8B-FP8 needs all three:
# accelerate to load an FP8 checkpoint, and `kernels` for the FP8 matmul.
lm = [
    "transformers",
    "accelerate",
    "kernels>=0.16,<0.17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["codenames*"]
