[project]
name = "codenamesai"
version = "0.1.0"
description = "A non-LLM Codenames spymaster that chooses clues against a listener model distilled from LLM guessers."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "lightgbm",
    "gensim",
    "nltk",
    "matplotlib",
    "wordfreq",
    "anthropic",
    "openai",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["codenames*"]
