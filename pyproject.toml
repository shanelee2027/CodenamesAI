[project]
name = "codenamesai"
version = "0.1.0"
description = "Codenames clue-giving agent built around a learned clue scorer over multiple word embedding spaces."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "torch",
    "gensim",
    "wikiextractor",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["codenames*"]
